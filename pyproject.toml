[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-processor"
version = "0.1.0"
description = "Streaming data processor lab project (Lab03)"
requires-python = ">=3.11"
authors = [{ name = "Anastasiia Brativnyk" }]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
stream-processor = "stream_processor.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
